<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <rect x="0" y="0" width="780" height="430" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="390" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">Mesmo tamanho físico, número de pixels diferente</text>
  <text x="390" y="64" text-anchor="middle" font-size="14" fill="#8A97A3">Um botão de “100 px” muda de tamanho aparente conforme a densidade da tela</text>

  <!-- Screen A: low density -->
  <g>
    <rect x="80" y="96" width="240" height="280" rx="14" fill="#3C3F41" stroke="#DFE1E5" stroke-width="2"/>
    <clipPath id="clipA"><rect x="82" y="98" width="236" height="276" rx="12"/></clipPath>
    <g clip-path="url(#clipA)" stroke="#454849" stroke-width="1">
      <line x1="80" y1="136" x2="320" y2="136"/><line x1="80" y1="176" x2="320" y2="176"/>
      <line x1="80" y1="216" x2="320" y2="216"/><line x1="80" y1="256" x2="320" y2="256"/>
      <line x1="80" y1="296" x2="320" y2="296"/><line x1="80" y1="336" x2="320" y2="336"/>
      <line x1="120" y1="96" x2="120" y2="376"/><line x1="160" y1="96" x2="160" y2="376"/>
      <line x1="200" y1="96" x2="200" y2="376"/><line x1="240" y1="96" x2="240" y2="376"/>
      <line x1="280" y1="96" x2="280" y2="376"/>
    </g>
    <!-- 100px block: large fraction -->
    <rect x="112" y="200" width="176" height="72" rx="10" fill="#3C2428" stroke="#F0899A" stroke-width="2"/>
    <text x="200" y="242" text-anchor="middle" font-size="17" font-weight="700" fill="#F0899A">100 px = grandão</text>
    <text x="200" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#DFE1E5">Tela A · 160 dpi (mdpi)</text>
    <text x="200" y="94" text-anchor="middle" font-size="12" fill="#94A3B8">pixels grandes, poucos</text>
  </g>

  <!-- Screen B: high density -->
  <g>
    <rect x="460" y="96" width="240" height="280" rx="14" fill="#3C3F41" stroke="#DFE1E5" stroke-width="2"/>
    <clipPath id="clipB"><rect x="462" y="98" width="236" height="276" rx="12"/></clipPath>
    <g clip-path="url(#clipB)" stroke="#454849" stroke-width="0.8">
      <line x1="460" y1="110" x2="700" y2="110"/><line x1="460" y1="124" x2="700" y2="124"/><line x1="460" y1="138" x2="700" y2="138"/><line x1="460" y1="152" x2="700" y2="152"/><line x1="460" y1="166" x2="700" y2="166"/><line x1="460" y1="180" x2="700" y2="180"/><line x1="460" y1="194" x2="700" y2="194"/><line x1="460" y1="208" x2="700" y2="208"/><line x1="460" y1="222" x2="700" y2="222"/><line x1="460" y1="236" x2="700" y2="236"/><line x1="460" y1="250" x2="700" y2="250"/><line x1="460" y1="264" x2="700" y2="264"/><line x1="460" y1="278" x2="700" y2="278"/><line x1="460" y1="292" x2="700" y2="292"/><line x1="460" y1="306" x2="700" y2="306"/><line x1="460" y1="320" x2="700" y2="320"/><line x1="460" y1="334" x2="700" y2="334"/><line x1="460" y1="348" x2="700" y2="348"/><line x1="460" y1="362" x2="700" y2="362"/>
      <line x1="474" y1="96" x2="474" y2="376"/><line x1="488" y1="96" x2="488" y2="376"/><line x1="502" y1="96" x2="502" y2="376"/><line x1="516" y1="96" x2="516" y2="376"/><line x1="530" y1="96" x2="530" y2="376"/><line x1="544" y1="96" x2="544" y2="376"/><line x1="558" y1="96" x2="558" y2="376"/><line x1="572" y1="96" x2="572" y2="376"/><line x1="586" y1="96" x2="586" y2="376"/><line x1="600" y1="96" x2="600" y2="376"/><line x1="614" y1="96" x2="614" y2="376"/><line x1="628" y1="96" x2="628" y2="376"/><line x1="642" y1="96" x2="642" y2="376"/><line x1="656" y1="96" x2="656" y2="376"/><line x1="670" y1="96" x2="670" y2="376"/><line x1="684" y1="96" x2="684" y2="376"/>
    </g>
    <!-- 100px block: small fraction -->
    <rect x="546" y="216" width="68" height="42" rx="7" fill="#3C2428" stroke="#F0899A" stroke-width="2"/>
    <text x="580" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#F0899A">100 px</text>
    <text x="580" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#DFE1E5">Tela B · 480 dpi (xxhdpi)</text>
    <text x="580" y="94" text-anchor="middle" font-size="12" fill="#94A3B8">pixels pequenos, muitos</text>
  </g>

  <!-- middle arrow -->
  <text x="390" y="240" text-anchor="middle" font-size="26" fill="#525659">→</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <marker id="mg" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto"><path d="M0 0 L7.5 3.2 L0 6.4 z" fill="#8ECB98"/></marker>
    <marker id="mb" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto"><path d="M0 0 L7.5 3.2 L0 6.4 z" fill="#AEB7F2"/></marker>
    <marker id="mo" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto"><path d="M0 0 L7.5 3.2 L0 6.4 z" fill="#E8A15C"/></marker>
    <marker id="mn" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#94A3B8"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="560" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">MVVM &#215; MVI — a mesma tela, duas disciplinas de estado</text>
  <text x="400" y="57" text-anchor="middle" font-size="13" fill="#8A97A3">MVI &#233; o MVVM levado ao extremo: <tspan font-family="ui-monospace,monospace" fill="#B7BFC7">um</tspan> estado imut&#225;vel + fluxo de sentido &#250;nico</text>

  <line x1="400" y1="80" x2="400" y2="524" stroke="#4E5254" stroke-dasharray="4 5"/>

  <!-- ══════════ MVVM (esquerda) ══════════ -->
  <text x="200" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#E8A15C">MVVM</text>
  <text x="200" y="123" text-anchor="middle" font-size="10.5" fill="#8A97A3">v&#225;rios observables, um por campo</text>

  <!-- View -->
  <rect x="70" y="138" width="260" height="52" rx="10" fill="#25392A" stroke="#84C48D" stroke-width="1.5"/>
  <text x="200" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#8ECB98">View (Composable / XML)</text>
  <text x="200" y="178" text-anchor="middle" font-size="10" fill="#9DBDB6">observa cada campo e redesenha</text>

  <!-- ViewModel -->
  <rect x="70" y="238" width="260" height="118" rx="10" fill="#2E2A22" stroke="#CC7832" stroke-width="1.5"/>
  <text x="200" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#E8A15C">ViewModel</text>
  <rect x="86" y="272" width="70" height="24" rx="5" fill="#3A2E20" stroke="#7A5A34"/>
  <text x="121" y="288" text-anchor="middle" font-size="9.5" fill="#E8A15C">nome</text>
  <rect x="163" y="272" width="74" height="24" rx="5" fill="#3A2E20" stroke="#7A5A34"/>
  <text x="200" y="288" text-anchor="middle" font-size="9.5" fill="#E8A15C">carregando</text>
  <rect x="244" y="272" width="70" height="24" rx="5" fill="#3A2E20" stroke="#7A5A34"/>
  <text x="279" y="288" text-anchor="middle" font-size="9.5" fill="#E8A15C">erro</text>
  <text x="200" y="318" text-anchor="middle" font-size="9.5" fill="#C9A97E">3 <tspan font-family="ui-monospace,monospace">StateFlow/LiveData</tspan> separados</text>
  <text x="200" y="337" text-anchor="middle" font-size="9.5" fill="#C9A97E">m&#233;todos p&#250;blicos: <tspan font-family="ui-monospace,monospace">aoEntrar()</tspan>&#8230;</text>

  <!-- Model -->
  <rect x="70" y="404" width="260" height="44" rx="10" fill="#2B2D2F" stroke="#4E5254"/>
  <text x="200" y="431" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B7BFC7">Model (Repository / UseCase)</text>

  <!-- setas MVVM -->
  <path d="M180 238 L180 190" fill="none" stroke="#8ECB98" stroke-width="2" marker-end="url(#mg)"/>
  <text x="150" y="216" text-anchor="end" font-size="9" fill="#8ECB98">observa</text>
  <path d="M220 190 L220 238" fill="none" stroke="#AEB7F2" stroke-width="2" marker-end="url(#mb)"/>
  <text x="250" y="216" text-anchor="start" font-size="9" fill="#AEB7F2">chama m&#233;todo</text>
  <path d="M200 356 L200 404" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#mn)"/>

  <text x="200" y="474" text-anchor="middle" font-size="10" fill="#B98A5A">&#9888; risco: campos podem ficar</text>
  <text x="200" y="490" text-anchor="middle" font-size="10" fill="#B98A5A">inconsistentes entre si (estado 2&#8203;&#215;)</text>
  <text x="200" y="512" text-anchor="middle" font-size="10" fill="#8A97A3">binding pode ser bidirecional</text>

  <!-- ══════════ MVI (direita) ══════════ -->
  <text x="600" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#AEB7F2">MVI</text>
  <text x="600" y="123" text-anchor="middle" font-size="10.5" fill="#8A97A3">um s&#243; UiState imut&#225;vel, fluxo em anel</text>

  <!-- View -->
  <rect x="470" y="138" width="260" height="52" rx="10" fill="#25392A" stroke="#84C48D" stroke-width="1.5"/>
  <text x="600" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#8ECB98">View = f(state)</text>
  <text x="600" y="178" text-anchor="middle" font-size="10" fill="#9DBDB6">recomp&#245;e a tela inteira do estado</text>

  <!-- Reducer / Store -->
  <rect x="470" y="238" width="260" height="118" rx="10" fill="#2E3350" stroke="#6366F1" stroke-width="1.5"/>
  <text x="600" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#AEB7F2">ViewModel + reducer</text>
  <rect x="512" y="274" width="176" height="26" rx="6" fill="#22273F" stroke="#4650A0"/>
  <text x="600" y="291" text-anchor="middle" font-size="10" fill="#AEB7F2"><tspan font-family="ui-monospace,monospace">StateFlow&lt;UiState&gt;</tspan> &#8212; 1 objeto</text>
  <text x="600" y="320" text-anchor="middle" font-size="9.5" fill="#AAB6C0"><tspan font-family="ui-monospace,monospace">reduce(state, intent) &#8594; state'</tspan></text>
  <text x="600" y="338" text-anchor="middle" font-size="9.5" fill="#AAB6C0">nova c&#243;pia imut&#225;vel a cada evento</text>

  <!-- Intent -->
  <rect x="470" y="404" width="260" height="44" rx="10" fill="#2B2D2F" stroke="#4E5254"/>
  <text x="600" y="424" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B7BFC7">Intent (Evento do usu&#225;rio)</text>
  <text x="600" y="440" text-anchor="middle" font-size="9.5" fill="#8A97A3"><tspan font-family="ui-monospace,monospace">sealed interface</tspan> — a inten&#231;&#227;o, n&#227;o o m&#233;todo</text>

  <!-- anel MVI: state desce, intent sobe -->
  <path d="M560 238 L560 190" fill="none" stroke="#8ECB98" stroke-width="2.2" marker-end="url(#mg)"/>
  <text x="548" y="216" text-anchor="end" font-size="9" font-weight="700" fill="#8ECB98">state &#8595;</text>
  <path d="M640 448 C 712 430, 712 210, 640 190" fill="none" stroke="#AEB7F2" stroke-width="2.2" marker-end="url(#mb)"/>
  <text x="726" y="322" text-anchor="middle" font-size="9" font-weight="700" fill="#AEB7F2" transform="rotate(90 726 322)">intent &#8593;</text>
  <path d="M600 356 L600 404" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#mn)" stroke-dasharray="3 3"/>

  <!-- side effect channel -->
  <path d="M470 300 C 424 300, 424 468, 470 468" fill="none" stroke="#E8A15C" stroke-width="1.8" marker-end="url(#mo)" stroke-dasharray="4 3"/>
  <text x="600" y="524" text-anchor="middle" font-size="9.5" fill="#E8A15C">efeitos one-shot (navegar, toast) saem por um canal &#224; parte</text>
  <text x="600" y="540" text-anchor="middle" font-size="10" fill="#8ECB98">&#9679; estado sempre consistente e reprodut&#237;vel</text>
</svg>

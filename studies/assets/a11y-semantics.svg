<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <marker id="as" markerWidth="12" markerHeight="12" refX="7" refY="3.4" orient="auto"><path d="M0 0 L8 3.4 L0 6.8 z" fill="#94A3B8"/></marker>
    <marker id="asg" markerWidth="12" markerHeight="12" refX="7" refY="3.4" orient="auto"><path d="M0 0 L8 3.4 L0 6.8 z" fill="#8ECB98"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">A &#225;rvore de sem&#226;ntica: o que o TalkBack enxerga</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#8A97A3">o leitor de tela n&#227;o v&#234; pixels &#8212; ele l&#234; a <tspan fill="#B7BFC7">sem&#226;ntica</tspan> que cada composable exp&#245;e</text>

  <!-- UI -->
  <text x="150" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#DFE1E5">o que aparece</text>
  <rect x="60" y="98" width="180" height="120" rx="10" fill="#2B2D2F" stroke="#4E5254"/>
  <circle cx="92" cy="130" r="16" fill="#3A2E20" stroke="#7A5A34"/>
  <text x="92" y="134" text-anchor="middle" font-size="12">🖼️</text>
  <text x="120" y="126" font-size="11" font-weight="700" fill="#DFE1E5">Ana Souza</text>
  <text x="120" y="142" font-size="9.5" fill="#8A97A3">online agora</text>
  <rect x="76" y="164" width="148" height="34" rx="8" fill="#2E3350" stroke="#6366F1"/>
  <text x="150" y="185" text-anchor="middle" font-size="10" fill="#AEB7F2">▶ Ligar</text>

  <!-- semantics -->
  <text x="400" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#DFE1E5">a sem&#226;ntica exposta</text>

  <!-- sem merge -->
  <rect x="300" y="98" width="200" height="120" rx="10" fill="#3A2420" stroke="#8A4A3A" stroke-width="1.3"/>
  <text x="400" y="116" text-anchor="middle" font-size="10" font-weight="700" fill="#E0928A">&#10007; sem cuidado: 3 paradas soltas</text>
  <text x="312" y="136" font-size="9" fill="#D9A9C4">1. imagem &#8220;sem descri&#231;&#227;o&#8221;</text>
  <text x="312" y="154" font-size="9" fill="#D9A9C4">2. &#8220;Ana Souza&#8221;</text>
  <text x="312" y="172" font-size="9" fill="#D9A9C4">3. &#8220;online agora&#8221;</text>
  <text x="312" y="196" font-size="8.5" fill="#E0928A">bot&#227;o &#8220;Ligar&#8221; sem dizer p/ quem</text>

  <!-- com merge -->
  <rect x="300" y="232" width="200" height="96" rx="10" fill="#1E3222" stroke="#3B6B47" stroke-width="1.3"/>
  <text x="400" y="250" text-anchor="middle" font-size="10" font-weight="700" fill="#8ECB98">&#10003; mergeDescendants + labels</text>
  <text x="312" y="270" font-size="9" fill="#9DBDB6">1 parada: &#8220;Ana Souza, online&#8221;</text>
  <text x="312" y="288" font-size="9" fill="#9DBDB6"><tspan font-family="ui-monospace,monospace">contentDescription</tspan> no avatar</text>
  <text x="312" y="306" font-size="9" fill="#9DBDB6">bot&#227;o: &#8220;Ligar para Ana&#8221;</text>
  <text x="312" y="322" font-size="8.5" fill="#8ECB98">role = Button, foco &#250;nico</text>

  <!-- talkback -->
  <text x="650" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#DFE1E5">o TalkBack fala</text>
  <rect x="560" y="98" width="200" height="230" rx="10" fill="#22273F" stroke="#4650A0"/>
  <text x="660" y="120" text-anchor="middle" font-size="24">🔊</text>
  <rect x="576" y="136" width="168" height="52" rx="8" fill="#2E3350"/>
  <text x="586" y="156" font-size="9.5" fill="#AEB7F2">&#8220;Ana Souza, online agora.</text>
  <text x="586" y="171" font-size="9.5" fill="#AEB7F2">Imagem de perfil.&#8221;</text>
  <rect x="576" y="198" width="168" height="52" rx="8" fill="#2E3350"/>
  <text x="586" y="218" font-size="9.5" fill="#AEB7F2">&#8220;Ligar para Ana,</text>
  <text x="586" y="233" font-size="9.5" fill="#AEB7F2">bot&#227;o. Toque duplo.&#8221;</text>
  <text x="660" y="278" text-anchor="middle" font-size="9" fill="#AAB6C0">navega&#231;&#227;o por gesto,</text>
  <text x="660" y="292" text-anchor="middle" font-size="9" fill="#AAB6C0">um foco de cada vez,</text>
  <text x="660" y="306" text-anchor="middle" font-size="9" fill="#AAB6C0">na ordem de leitura</text>

  <path d="M240 150 L298 150" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#as)"/>
  <path d="M500 276 C 528 276, 532 200, 558 190" fill="none" stroke="#8ECB98" stroke-width="1.8" marker-end="url(#asg)"/>
  <text x="660" y="352" text-anchor="middle" font-size="9" fill="#8A97A3">só a semântica boa (verde) vira uma fala clara</text>
</svg>

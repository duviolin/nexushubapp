<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <rect x="0" y="0" width="780" height="420" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="390" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">Margem × Padding × Gap — três espaços diferentes</text>
  <text x="390" y="59" text-anchor="middle" font-size="13.5" fill="#8A97A3">Fora da caixa · dentro da caixa · entre os filhos</text>

  <!-- neighbor -->
  <rect x="170" y="74" width="440" height="26" rx="6" fill="#3C3F41"/>
  <text x="390" y="91" text-anchor="middle" font-size="12" fill="#8A97A3">elemento vizinho / borda da tela</text>

  <!-- card -->
  <rect x="170" y="132" width="440" height="240" rx="12" fill="#3C3F41" stroke="#6366F1" stroke-width="2"/>
  <!-- inner content boundary (padding edge) -->
  <rect x="198" y="160" width="384" height="184" rx="8" fill="#2E3350" stroke="#4A5490" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- items -->
  <rect x="214" y="212" width="150" height="120" rx="8" fill="#2E3350" stroke="#6366F1" stroke-width="1.2"/>
  <text x="289" y="277" text-anchor="middle" font-size="14" font-weight="600" fill="#AEB7F2">item A</text>
  <rect x="416" y="212" width="150" height="120" rx="8" fill="#2E3350" stroke="#6366F1" stroke-width="1.2"/>
  <text x="491" y="277" text-anchor="middle" font-size="14" font-weight="600" fill="#AEB7F2">item B</text>

  <!-- MARGIN dim (vertical, between neighbor and card) -->
  <g stroke="#0EA5A4" stroke-width="1.5">
    <line x1="250" y1="100" x2="250" y2="132"/>
    <line x1="243" y1="100" x2="257" y2="100"/><line x1="243" y1="132" x2="257" y2="132"/>
  </g>
  <rect x="266" y="104" width="112" height="24" rx="12" fill="#1F332F" stroke="#0EA5A4" stroke-width="1"/>
  <text x="322" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#7FC9BD">16dp · MARGEM</text>

  <!-- PADDING dim (vertical, card top -> content top) -->
  <g stroke="#D97706" stroke-width="1.5">
    <line x1="430" y1="132" x2="430" y2="160"/>
    <line x1="423" y1="132" x2="437" y2="132"/><line x1="423" y1="160" x2="437" y2="160"/>
  </g>
  <rect x="446" y="134" width="120" height="24" rx="12" fill="#3C3420" stroke="#D97706" stroke-width="1"/>
  <text x="506" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#E3AE72">12dp · PADDING</text>

  <!-- GAP dim (horizontal, between items) -->
  <g stroke="#EC8FBB" stroke-width="1.5">
    <line x1="364" y1="272" x2="416" y2="272"/>
    <line x1="364" y1="265" x2="364" y2="279"/><line x1="416" y1="265" x2="416" y2="279"/>
  </g>
  <rect x="334" y="336" width="112" height="24" rx="12" fill="#352430" stroke="#EC8FBB" stroke-width="1"/>
  <text x="390" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#EC8FBB">8dp · GAP</text>

  <!-- compose mapping -->
  <text x="390" y="400" text-anchor="middle" font-size="12.5" fill="#AAB6C0">Em Compose: <tspan font-weight="700" fill="#7FC9BD">padding antes do .background()</tspan> = margem · <tspan font-weight="700" fill="#E3AE72">padding depois</tspan> = interno · <tspan font-weight="700" fill="#EC8FBB">Arrangement.spacedBy()</tspan> = gap</text>
</svg>

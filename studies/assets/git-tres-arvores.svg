<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#94A3B8"/></marker>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#7FC9BD"/></marker>
  </defs>
  <rect x="0" y="0" width="780" height="380" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">As três áreas do Git (+ o remoto)</text>
  <text x="390" y="57" text-anchor="middle" font-size="13.5" fill="#8A97A3">o mesmo arquivo em quatro lugares — cada comando move de um para o outro</text>

  <!-- boxes -->
  <rect x="24"  y="96" width="168" height="70" rx="10" fill="#3C3F41" stroke="#DFE1E5" stroke-width="1.3"/>
  <text x="108" y="123" text-anchor="middle" font-size="13.5" font-weight="700" fill="#DFE1E5">Área de trabalho</text>
  <text x="108" y="141" text-anchor="middle" font-size="11" fill="#AAB6C0">os arquivos que você edita</text>
  <text x="108" y="156" text-anchor="middle" font-size="10.5" fill="#8A97A3" font-family="ui-monospace,monospace">working directory</text>

  <rect x="216" y="96" width="168" height="70" rx="10" fill="#3C3420" stroke="#D97706" stroke-width="1.3"/>
  <text x="300" y="123" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E3AE72">Palco</text>
  <text x="300" y="141" text-anchor="middle" font-size="11" fill="#D9C4A0">o que entra no próximo commit</text>
  <text x="300" y="156" text-anchor="middle" font-size="10.5" fill="#B79A6E" font-family="ui-monospace,monospace">staging / index</text>

  <rect x="408" y="96" width="168" height="70" rx="10" fill="#2E3350" stroke="#6366F1" stroke-width="1.3"/>
  <text x="492" y="123" text-anchor="middle" font-size="13.5" font-weight="700" fill="#AEB7F2">Repositório local</text>
  <text x="492" y="141" text-anchor="middle" font-size="11" fill="#AAB6C0">o histórico de commits</text>
  <text x="492" y="156" text-anchor="middle" font-size="10.5" fill="#8A97A3" font-family="ui-monospace,monospace">.git</text>

  <rect x="600" y="96" width="156" height="70" rx="10" fill="#1F332F" stroke="#7FC9BD" stroke-width="1.3"/>
  <text x="678" y="123" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7FC9BD">Remoto</text>
  <text x="678" y="141" text-anchor="middle" font-size="11" fill="#9DBDB6">GitHub / GitLab</text>
  <text x="678" y="156" text-anchor="middle" font-size="10.5" fill="#6E938C" font-family="ui-monospace,monospace">origin</text>

  <!-- forward arrows (top) -->
  <line x1="192" y1="118" x2="214" y2="118" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="203" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#B7BFC7" font-family="ui-monospace,monospace">add</text>

  <line x1="384" y1="118" x2="406" y2="118" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="395" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#B7BFC7" font-family="ui-monospace,monospace">commit</text>

  <line x1="576" y1="118" x2="598" y2="118" stroke="#7FC9BD" stroke-width="1.6" marker-end="url(#arb)"/>
  <text x="587" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7FC9BD" font-family="ui-monospace,monospace">push</text>

  <!-- back arrows (bottom) -->
  <path d="M678 166 V 200 H 108 V 168" fill="none" stroke="#7FC9BD" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arb)"/>
  <text x="393" y="192" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7FC9BD" font-family="ui-monospace,monospace">pull  ·  baixa do remoto e integra ao seu histórico + disco</text>

  <path d="M492 166 V 232 H 108 V 168" fill="none" stroke="#8A97A3" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="300" y="224" text-anchor="middle" font-size="10.5" font-weight="700" fill="#B7BFC7" font-family="ui-monospace,monospace">checkout / switch / restore  ·  traz uma versão do histórico de volta pro disco</text>

  <!-- legend strip -->
  <rect x="24" y="292" width="732" height="66" rx="10" fill="#2B2D2F" stroke="#4E5254"/>
  <text x="40" y="315" font-size="12" font-weight="700" fill="#DFE1E5">Fluxo do dia:</text>
  <text x="40" y="336" font-size="11.5" fill="#B7BFC7" font-family="ui-monospace,monospace">git status  →  git add -p  →  git commit -m "..."  →  git pull --rebase  →  git push</text>
  <text x="40" y="352" font-size="10.5" fill="#8A97A3">edite &#8594; escolha o que vai no commit &#8594; grave no histórico &#8594; sincronize antes de enviar &#8594; publique no remoto</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#94A3B8"/></marker></defs>
  <rect x="0" y="0" width="780" height="470" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">Quem baixa o quê: do build.gradle.kts ao emulador</text>
  <text x="390" y="57" text-anchor="middle" font-size="13.5" fill="#8A97A3">Ligando o almoxarifado (SDK) à fábrica (Gradle) e ao AGP</text>

  <!-- você escreve -->
  <rect x="255" y="72" width="270" height="40" rx="20" fill="#3C3F41" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="390" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#B7BFC7">Você escreve <tspan font-family="'SF Mono',ui-monospace,monospace" font-weight="700" fill="#DFE1E5">compileSdk = 35</tspan></text>
  <line x1="390" y1="112" x2="390" y2="130" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="250" y="132" width="280" height="42" rx="10" fill="#2E3350" stroke="#6366F1" stroke-width="1.4"/>
  <text x="390" y="158" text-anchor="middle" font-size="12.5" fill="#AEB7F2">O <tspan font-weight="700">AGP</tspan> pede “a gaveta platforms/android-35”</text>
  <line x1="390" y1="174" x2="390" y2="192" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="250" y="194" width="280" height="42" rx="10" fill="#2E3350" stroke="#6366F1" stroke-width="1.4"/>
  <text x="390" y="220" text-anchor="middle" font-size="12.5" fill="#AEB7F2">O <tspan font-weight="700">Gradle</tspan> acha o SDK via local.properties</text>

  <!-- fan to 3 branches -->
  <path d="M390 236 C 300 250, 190 252, 140 268" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="390" y1="236" x2="390" y2="268" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M390 236 C 480 250, 590 252, 640 268" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="30" y="270" width="220" height="56" rx="10" fill="#3C3F41" stroke="#DFE1E5" stroke-width="1.3"/>
  <text x="140" y="292" text-anchor="middle" font-size="12.5" font-weight="700" fill="#DFE1E5" font-family="'SF Mono',ui-monospace,monospace">platforms/android-35</text>
  <text x="140" y="312" text-anchor="middle" font-size="12" fill="#84C48D" font-weight="600">= compilar</text>

  <rect x="280" y="270" width="220" height="56" rx="10" fill="#3C3F41" stroke="#DFE1E5" stroke-width="1.3"/>
  <text x="390" y="292" text-anchor="middle" font-size="12.5" font-weight="700" fill="#DFE1E5" font-family="'SF Mono',ui-monospace,monospace">build-tools/</text>
  <text x="390" y="312" text-anchor="middle" font-size="12" fill="#D97706" font-weight="600">aapt2·d8·r8 = montar o APK</text>

  <rect x="530" y="270" width="220" height="56" rx="10" fill="#3C3F41" stroke="#DFE1E5" stroke-width="1.3"/>
  <text x="640" y="292" text-anchor="middle" font-size="12.5" font-weight="700" fill="#DFE1E5" font-family="'SF Mono',ui-monospace,monospace">platform-tools/</text>
  <text x="640" y="312" text-anchor="middle" font-size="12" fill="#6366F1" font-weight="600">adb = instalar</text>

  <!-- branch1 + branch2 -> APK -->
  <path d="M140 326 C 160 360, 220 358, 250 366" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M390 326 C 370 350, 330 358, 300 366" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="185" y="368" width="180" height="42" rx="21" fill="#25392A" stroke="#84C48D" stroke-width="1.5"/>
  <text x="275" y="394" text-anchor="middle" font-size="13" font-weight="700" fill="#8ECB98">APK assinado</text>

  <!-- APK + branch3 -> emulador -->
  <path d="M365 389 C 420 400, 430 410, 470 418" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M640 326 C 640 380, 620 408, 610 418" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="470" y="410" font-size="10.5" font-weight="600" fill="#6366F1">adb</text>
  <rect x="360" y="420" width="300" height="42" rx="10" fill="#2E3350" stroke="#6366F1" stroke-width="1.4"/>
  <text x="510" y="446" text-anchor="middle" font-size="12.5" fill="#AEB7F2">📱 <tspan font-weight="700">Emulador</tspan> — system-images/android-37</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">Efeitos visuais: quatro caixas de ferramentas</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#8A97A3">quase tudo &#233; um <tspan font-family="ui-monospace,monospace" fill="#B7BFC7">Modifier</tspan> que age na fase de <tspan font-weight="700">desenho</tspan> &#8212; barato, sem recompor</text>

  <!-- Transform -->
  <rect x="24" y="78" width="240" height="140" rx="12" fill="#2E3350" stroke="#6366F1" stroke-width="1.4"/>
  <text x="44" y="102" font-size="13" font-weight="700" fill="#AEB7F2">1 · Transformar</text>
  <text x="44" y="122" font-family="ui-monospace,monospace" font-size="10" fill="#AAB6C0">Modifier.graphicsLayer { }</text>
  <text x="44" y="140" font-size="10" fill="#AAB6C0">alpha, escala, rota&#231;&#227;o,</text>
  <text x="44" y="155" font-size="10" fill="#AAB6C0">transla&#231;&#227;o, transformOrigin</text>
  <text x="44" y="175" font-size="10" fill="#AAB6C0">sombra (<tspan font-family="ui-monospace,monospace">shadowElevation</tspan>),</text>
  <text x="44" y="190" font-size="10" fill="#AAB6C0"><tspan font-family="ui-monospace,monospace">clip</tspan> por <tspan font-family="ui-monospace,monospace">shape</tspan></text>
  <text x="44" y="209" font-size="9" fill="#8A97A3">o canivete de anima&#231;&#227;o barata</text>

  <!-- Recortar/moldar -->
  <rect x="280" y="78" width="240" height="140" rx="12" fill="#25392A" stroke="#84C48D" stroke-width="1.4"/>
  <text x="300" y="102" font-size="13" font-weight="700" fill="#8ECB98">2 · Moldar &amp; contornar</text>
  <text x="300" y="122" font-family="ui-monospace,monospace" font-size="10" fill="#9DBDB6">Modifier.clip(shape)</text>
  <text x="300" y="140" font-family="ui-monospace,monospace" font-size="10" fill="#9DBDB6">.shadow(elev, shape)</text>
  <text x="300" y="158" font-family="ui-monospace,monospace" font-size="10" fill="#9DBDB6">.border(w, color, shape)</text>
  <rect x="300" y="170" width="40" height="30" rx="12" fill="#1E3222" stroke="#84C48D"/>
  <rect x="348" y="170" width="40" height="30" rx="4" fill="#1E3222" stroke="#84C48D"/>
  <circle cx="416" cy="185" r="15" fill="#1E3222" stroke="#84C48D"/>
  <text x="300" y="213" font-size="9" fill="#8A97A3">cantos, sombra e borda por shape</text>

  <!-- Pintar -->
  <rect x="536" y="78" width="240" height="140" rx="12" fill="#2E2A22" stroke="#CC7832" stroke-width="1.4"/>
  <text x="556" y="102" font-size="13" font-weight="700" fill="#E8A15C">3 · Pintar (Brush)</text>
  <text x="556" y="122" font-family="ui-monospace,monospace" font-size="10" fill="#C9A97E">background(Brush.linear&#8230;)</text>
  <text x="556" y="140" font-size="10" fill="#C9A97E">gradientes: linear, radial,</text>
  <text x="556" y="155" font-size="10" fill="#C9A97E">sweep &#8212; e em texto tamb&#233;m</text>
  <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CC7832"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#84C48D"/><stop offset="1" stop-color="#25392A"/></radialGradient></defs>
  <rect x="556" y="168" width="90" height="32" rx="6" fill="url(#g1)"/>
  <rect x="654" y="168" width="60" height="32" rx="6" fill="url(#g2)"/>
  <text x="556" y="213" font-size="9" fill="#8A97A3">um Brush no lugar de uma Color</text>

  <!-- Desenhar/filtrar -->
  <rect x="24" y="234" width="496" height="128" rx="12" fill="#2B2D2F" stroke="#4E5254"/>
  <text x="44" y="258" font-size="13" font-weight="700" fill="#DFE1E5">4 · Desenhar &amp; filtrar (quando nada pronto serve)</text>
  <text x="44" y="280" font-family="ui-monospace,monospace" font-size="10" fill="#AAB6C0">Modifier.drawBehind { }  /  drawWithContent { }  /  Canvas { }</text>
  <text x="44" y="296" font-size="10" fill="#AAB6C0">acesso ao <tspan font-family="ui-monospace,monospace" fill="#B7BFC7">DrawScope</tspan>: <tspan font-family="ui-monospace,monospace">drawRect</tspan>, <tspan font-family="ui-monospace,monospace">drawPath</tspan>, <tspan font-family="ui-monospace,monospace">drawArc</tspan> &#8212; um badge, um gr&#225;fico, um progresso</text>
  <text x="44" y="316" font-family="ui-monospace,monospace" font-size="10" fill="#AAB6C0">Modifier.blur(r)   ·   drawWithContent + BlendMode   ·   RenderEffect</text>
  <text x="44" y="332" font-size="10" fill="#AAB6C0">desfoque, m&#225;scaras e mistura de camadas (Android 12+ p/ alguns)</text>
  <text x="44" y="352" font-size="9" fill="#8A97A3">&#233; a v&#225;lvula de escape: poder total do Canvas, ao custo de fazer &#224; m&#227;o</text>

  <!-- regra lateral -->
  <rect x="536" y="234" width="240" height="128" rx="12" fill="#2E2A22" stroke="#CC7832"/>
  <text x="556" y="258" font-size="12" font-weight="700" fill="#E8A15C">🔒 A regra de ouro</text>
  <text x="556" y="280" font-size="10" fill="#C9A97E">esses modifiers agem na fase de</text>
  <text x="556" y="295" font-size="10" fill="#C9A97E"><tspan font-weight="700">desenho</tspan> &#8212; mudar a alpha/escala</text>
  <text x="556" y="310" font-size="10" fill="#C9A97E">em <tspan font-family="ui-monospace,monospace">graphicsLayer{}</tspan> <tspan font-weight="700">n&#227;o</tspan></text>
  <text x="556" y="325" font-size="10" fill="#C9A97E">recomp&#245;e nem refaz layout.</text>
  <text x="556" y="345" font-size="9.5" fill="#8ECB98">por isso anima&#231;&#227;o visual &#233; barata aqui</text>
</svg>

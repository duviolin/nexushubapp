<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <marker id="ev" markerWidth="12" markerHeight="12" refX="7" refY="3.4" orient="auto"><path d="M0 0 L8 3.4 L0 6.8 z" fill="#94A3B8"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="340" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">A linhagem dos padr&#245;es de apresenta&#231;&#227;o</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#8A97A3">cada passo tira acoplamento da tela e empurra a l&#243;gica para algo test&#225;vel</text>

  <!-- trilho -->
  <line x1="60" y1="150" x2="740" y2="150" stroke="#4E5254" stroke-width="2"/>

  <!-- MVC -->
  <rect x="52" y="112" width="150" height="76" rx="10" fill="#2B2D2F" stroke="#4E5254"/>
  <text x="127" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#B7BFC7">MVC</text>
  <text x="127" y="153" text-anchor="middle" font-size="9.5" fill="#8A97A3">Activity = Controller</text>
  <text x="127" y="168" text-anchor="middle" font-size="9.5" fill="#8A97A3">+ View acoplados</text>
  <text x="127" y="182" text-anchor="middle" font-size="9" fill="#B98A5A">tela testa mal</text>

  <!-- MVP -->
  <rect x="218" y="112" width="150" height="76" rx="10" fill="#2B2D2F" stroke="#4E5254"/>
  <text x="293" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#B7BFC7">MVP</text>
  <text x="293" y="153" text-anchor="middle" font-size="9.5" fill="#8A97A3">Presenter fala com a</text>
  <text x="293" y="168" text-anchor="middle" font-size="9.5" fill="#8A97A3">View por interface</text>
  <text x="293" y="182" text-anchor="middle" font-size="9" fill="#B98A5A">muito boilerplate</text>

  <!-- MVVM -->
  <rect x="384" y="106" width="150" height="88" rx="10" fill="#2E2A22" stroke="#CC7832" stroke-width="1.6"/>
  <text x="459" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#E8A15C">MVVM</text>
  <text x="459" y="149" text-anchor="middle" font-size="9.5" fill="#C9A97E">ViewModel exp&#245;e</text>
  <text x="459" y="164" text-anchor="middle" font-size="9.5" fill="#C9A97E">observables; a View</text>
  <text x="459" y="179" text-anchor="middle" font-size="9.5" fill="#C9A97E">reage. Sem interface.</text>

  <!-- MVI -->
  <rect x="550" y="106" width="188" height="88" rx="10" fill="#2E3350" stroke="#6366F1" stroke-width="1.6"/>
  <text x="644" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#AEB7F2">MVI / UDF</text>
  <text x="644" y="149" text-anchor="middle" font-size="9.5" fill="#AAB6C0">um UiState imut&#225;vel,</text>
  <text x="644" y="164" text-anchor="middle" font-size="9.5" fill="#AAB6C0">fluxo unidirecional,</text>
  <text x="644" y="179" text-anchor="middle" font-size="9.5" fill="#8ECB98">tela = f(state)</text>

  <!-- setas -->
  <path d="M202 150 L216 150" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ev)"/>
  <path d="M368 150 L382 150" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ev)"/>
  <path d="M534 150 L548 150" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ev)"/>

  <rect x="52" y="222" width="686" height="86" rx="10" fill="#2B2D2F" stroke="#4E5254"/>
  <text x="68" y="245" font-size="11.5" font-weight="700" fill="#DFE1E5">O que muda de verdade &#8594; para onde vai o ESTADO</text>
  <text x="68" y="266" font-size="10.5" fill="#AAB6C0">MVC/MVP: estado mora na <tspan fill="#B7BFC7">View</tspan> e na Activity &#8212; some no giro de tela, dif&#237;cil de testar sem subir a UI.</text>
  <text x="68" y="285" font-size="10.5" fill="#AAB6C0">MVVM: estado sobe para o <tspan fill="#E8A15C">ViewModel</tspan>, que sobrevive &#224; recomposi&#231;&#227;o &#8212; mas fica espalhado em v&#225;rios campos.</text>
  <text x="68" y="304" font-size="10.5" fill="#AAB6C0">MVI: estado vira <tspan fill="#AEB7F2">um objeto s&#243;</tspan>, imut&#225;vel &#8212; qualquer bug se reproduz s&#243; recriando aquele <tspan font-family="ui-monospace,monospace" fill="#8ECB98">UiState</tspan>.</text>
</svg>

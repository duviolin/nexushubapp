<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <marker id="fo" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto"><path d="M0 0 L7.5 3.2 L0 6.4 z" fill="#AEB7F2"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">Foco: quem não toca na tela também precisa navegar</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#8A97A3">teclado, controle de TV (D-pad) e Switch Access percorrem a UI <tspan fill="#B7BFC7">um foco por vez</tspan></text>

  <!-- phone -->
  <rect x="40" y="78" width="250" height="272" rx="16" fill="#2B2D2F" stroke="#4E5254" stroke-width="1.5"/>
  <!-- campo 1 -->
  <rect x="64" y="100" width="202" height="34" rx="7" fill="#2E3350" stroke="#6366F1" stroke-width="2"/>
  <circle cx="80" cy="117" r="9" fill="#22273F" stroke="#AEB7F2"/><text x="80" y="121" text-anchor="middle" font-size="10" font-weight="700" fill="#AEB7F2">1</text>
  <text x="98" y="121" font-size="10" fill="#AAB6C0">campo e-mail</text>
  <!-- campo 2 -->
  <rect x="64" y="144" width="202" height="34" rx="7" fill="#2B2D2F" stroke="#4E5254"/>
  <circle cx="80" cy="161" r="9" fill="#22273F" stroke="#AEB7F2"/><text x="80" y="165" text-anchor="middle" font-size="10" font-weight="700" fill="#AEB7F2">2</text>
  <text x="98" y="165" font-size="10" fill="#8A97A3">campo senha</text>

  <!-- focusGroup: linha de chips -->
  <rect x="60" y="192" width="210" height="52" rx="9" fill="#1E3222" stroke="#3B6B47" stroke-dasharray="4 3"/>
  <text x="68" y="207" font-size="8.5" fill="#8ECB98">focusGroup (entra/sai como bloco)</text>
  <rect x="70" y="212" width="58" height="26" rx="6" fill="#2B2D2F" stroke="#4E5254"/><text x="99" y="229" text-anchor="middle" font-size="9" fill="#8A97A3">chip A</text>
  <rect x="134" y="212" width="58" height="26" rx="6" fill="#2B2D2F" stroke="#4E5254"/><text x="163" y="229" text-anchor="middle" font-size="9" fill="#8A97A3">chip B</text>
  <rect x="198" y="212" width="58" height="26" rx="6" fill="#2B2D2F" stroke="#4E5254"/><text x="227" y="229" text-anchor="middle" font-size="9" fill="#8A97A3">chip C</text>
  <circle cx="80" cy="205" r="9" fill="#22273F" stroke="#AEB7F2"/><text x="80" y="209" text-anchor="middle" font-size="10" font-weight="700" fill="#AEB7F2">3</text>

  <!-- botão -->
  <rect x="64" y="256" width="202" height="38" rx="9" fill="#2E3350" stroke="#6366F1"/>
  <circle cx="80" cy="275" r="9" fill="#22273F" stroke="#AEB7F2"/><text x="80" y="279" text-anchor="middle" font-size="10" font-weight="700" fill="#AEB7F2">4</text>
  <text x="165" y="279" text-anchor="middle" font-size="10.5" fill="#AEB7F2">Entrar</text>

  <!-- setas de ordem -->
  <path d="M255 134 C 285 140, 285 138, 255 144" fill="none" stroke="#AEB7F2" stroke-width="1.6" marker-end="url(#fo)"/>
  <path d="M255 178 C 285 186, 285 184, 255 200" fill="none" stroke="#AEB7F2" stroke-width="1.6" marker-end="url(#fo)"/>
  <path d="M255 238 C 285 250, 285 250, 255 262" fill="none" stroke="#AEB7F2" stroke-width="1.6" marker-end="url(#fo)"/>
  <text x="165" y="330" text-anchor="middle" font-size="9" fill="#8A97A3">ordem de foco = ordem de leitura (cima → baixo)</text>

  <!-- direita: métodos -->
  <rect x="320" y="86" width="452" height="86" rx="10" fill="#2E2A22" stroke="#CC7832"/>
  <text x="336" y="108" font-size="12" font-weight="700" fill="#E8A15C">Quem depende do foco</text>
  <text x="336" y="129" font-size="10" fill="#C9A97E">&#8226; <strong>teclado</strong> (Tab / Shift+Tab) &#8212; muita gente com mobilidade reduzida;</text>
  <text x="336" y="145" font-size="10" fill="#C9A97E">&#8226; <strong>D-pad / controle</strong> em Android TV;</text>
  <text x="336" y="161" font-size="10" fill="#C9A97E">&#8226; <strong>Switch Access</strong> &#8212; 1&#8211;2 bot&#245;es varrem a tela automaticamente.</text>

  <rect x="320" y="184" width="452" height="80" rx="10" fill="#25392A" stroke="#84C48D"/>
  <text x="336" y="206" font-size="12" font-weight="700" fill="#8ECB98">O que voc&#234; controla no Compose</text>
  <text x="336" y="227" font-family="ui-monospace,monospace" font-size="9.5" fill="#9DBDB6">Modifier.focusable() / focusGroup() / focusRequester()</text>
  <text x="336" y="243" font-family="ui-monospace,monospace" font-size="9.5" fill="#9DBDB6">focusProperties { next = ...; up = ... }  // ajusta a ordem</text>
  <text x="336" y="259" font-size="9.5" fill="#9DBDB6">clique padr&#227;o j&#225; &#233; focável; visual de foco vem do componente M3</text>

  <rect x="320" y="276" width="452" height="74" rx="10" fill="#2E3350" stroke="#6366F1"/>
  <text x="336" y="298" font-size="12" font-weight="700" fill="#AEB7F2">A&#231;&#245;es customizadas</text>
  <text x="336" y="319" font-size="10" fill="#AAB6C0">gesto complexo (arrastar p/ excluir) precisa de uma alternativa:</text>
  <text x="336" y="335" font-family="ui-monospace,monospace" font-size="9.5" fill="#AAB6C0">semantics { customActions = listOf(Excluir, Arquivar) }</text>
</svg>

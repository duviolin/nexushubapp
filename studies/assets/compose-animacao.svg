<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <marker id="an" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto"><path d="M0 0 L7.5 3.2 L0 6.4 z" fill="#94A3B8"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="420" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">Qual API de anima&#231;&#227;o usar? Comece pela pergunta</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#8A97A3">quase tudo &#233; <tspan font-family="ui-monospace,monospace" fill="#B7BFC7">animate*AsState</tspan> &#8212; s&#243; suba de n&#237;vel quando ele n&#227;o basta</text>

  <!-- pergunta central -->
  <rect x="300" y="78" width="200" height="44" rx="10" fill="#2B2D2F" stroke="#4E5254"/>
  <text x="400" y="105" text-anchor="middle" font-size="12.5" font-weight="700" fill="#DFE1E5">O que est&#225; animando?</text>

  <!-- 6 folhas -->
  <!-- 1 valor único -->
  <rect x="30" y="150" width="230" height="72" rx="10" fill="#25392A" stroke="#84C48D" stroke-width="1.4"/>
  <text x="44" y="172" font-size="11" font-weight="700" fill="#8ECB98">um valor (cor, tamanho, alpha)</text>
  <text x="44" y="192" font-family="ui-monospace,monospace" font-size="10" fill="#9DBDB6">animateDpAsState { }</text>
  <text x="44" y="208" font-size="9.5" fill="#9DBDB6">declarativo: muda o alvo, ele desliza</text>

  <!-- 2 aparecer/sumir -->
  <rect x="285" y="150" width="230" height="72" rx="10" fill="#25392A" stroke="#84C48D" stroke-width="1.4"/>
  <text x="299" y="172" font-size="11" font-weight="700" fill="#8ECB98">entrar / sair da tela</text>
  <text x="299" y="192" font-family="ui-monospace,monospace" font-size="10" fill="#9DBDB6">AnimatedVisibility { }</text>
  <text x="299" y="208" font-size="9.5" fill="#9DBDB6">fade/slide/expand de entrada e sa&#237;da</text>

  <!-- 3 trocar conteúdo -->
  <rect x="540" y="150" width="230" height="72" rx="10" fill="#25392A" stroke="#84C48D" stroke-width="1.4"/>
  <text x="554" y="172" font-size="11" font-weight="700" fill="#8ECB98">trocar um conte&#250;do por outro</text>
  <text x="554" y="192" font-family="ui-monospace,monospace" font-size="10" fill="#9DBDB6">AnimatedContent { }</text>
  <text x="554" y="208" font-size="9.5" fill="#9DBDB6">ex.: contador, troca de aba</text>

  <!-- 4 vários coordenados -->
  <rect x="30" y="242" width="230" height="72" rx="10" fill="#2E3350" stroke="#6366F1" stroke-width="1.4"/>
  <text x="44" y="264" font-size="11" font-weight="700" fill="#AEB7F2">v&#225;rios valores juntos (1 gatilho)</text>
  <text x="44" y="284" font-family="ui-monospace,monospace" font-size="10" fill="#AAB6C0">updateTransition { }</text>
  <text x="44" y="300" font-size="9.5" fill="#AAB6C0">cor + tamanho + rota&#231;&#227;o em sincronia</text>

  <!-- 5 imperativo/gesto -->
  <rect x="285" y="242" width="230" height="72" rx="10" fill="#2E3350" stroke="#6366F1" stroke-width="1.4"/>
  <text x="299" y="264" font-size="11" font-weight="700" fill="#AEB7F2">controle fino / gesto</text>
  <text x="299" y="284" font-family="ui-monospace,monospace" font-size="10" fill="#AAB6C0">Animatable / animateTo</text>
  <text x="299" y="300" font-size="9.5" fill="#AAB6C0">arrastar, fling, interromper no meio</text>

  <!-- 6 lista -->
  <rect x="540" y="242" width="230" height="72" rx="10" fill="#2E3350" stroke="#6366F1" stroke-width="1.4"/>
  <text x="554" y="264" font-size="11" font-weight="700" fill="#AEB7F2">itens de lista reordenando</text>
  <text x="554" y="284" font-family="ui-monospace,monospace" font-size="10" fill="#AAB6C0">Modifier.animateItem()</text>
  <text x="554" y="300" font-size="9.5" fill="#AAB6C0">em LazyColumn, com <tspan font-family="ui-monospace,monospace">key</tspan></text>

  <path d="M370 122 C 200 134, 150 140, 130 148" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#an)"/>
  <path d="M400 122 L400 148" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#an)"/>
  <path d="M430 122 C 600 134, 650 140, 665 148" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#an)"/>

  <rect x="30" y="336" width="740" height="66" rx="10" fill="#2E2A22" stroke="#CC7832"/>
  <text x="48" y="358" font-size="11.5" font-weight="700" fill="#E8A15C">🔒 Regras que sustentam a anima&#231;&#227;o</text>
  <text x="48" y="378" font-size="10" fill="#C9A97E">&#8226; anime na fase <strong>tardia</strong> (<tspan font-family="ui-monospace,monospace">graphicsLayer{}</tspan>/<tspan font-family="ui-monospace,monospace">offset{}</tspan> lambda) p/ n&#227;o recompor a cada frame;</text>
  <text x="48" y="394" font-size="10" fill="#C9A97E">&#8226; respeite <strong>reduzir movimento</strong> (acessibilidade); &#8226; dura&#231;&#227;o curta e <em>easing</em> do Material &#8212; movimento com prop&#243;sito.</text>
</svg>

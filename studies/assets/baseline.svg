<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#94A3B8"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#F0899A"/></marker>
  </defs>
  <rect x="0" y="0" width="780" height="400" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">Baseline: congela o legado, cobra o novo</text>
  <text x="390" y="57" text-anchor="middle" font-size="13.5" fill="#8A97A3">adote a ferramenta num projeto antigo sem parar tudo para consertar de uma vez</text>

  <!-- existing issues pile -->
  <rect x="30" y="92" width="220" height="150" rx="10" fill="#2B2D2F" stroke="#4E5254"/>
  <text x="140" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#DFE1E5">247 avisos no código antigo</text>
  <g font-family="ui-monospace,monospace" font-size="10.5" fill="#E3AE72">
    <text x="46" y="140">⚠ LongMethod   · Pedido.kt</text>
    <text x="46" y="160">⚠ MagicNumber  · Preco.kt</text>
    <text x="46" y="180">⚠ ComplexCond  · Frete.kt</text>
    <text x="46" y="200">⚠ …mais 244</text>
  </g>
  <text x="140" y="228" text-anchor="middle" font-size="10.5" fill="#8A97A3">reais, mas não dá pra consertar hoje</text>

  <!-- arrow to baseline -->
  <path d="M250 167 H 300" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="276" y="150" text-anchor="middle" font-size="9" font-weight="700" fill="#B7BFC7" font-family="ui-monospace,monospace">detekt</text>
  <text x="276" y="161" text-anchor="middle" font-size="9" font-weight="700" fill="#B7BFC7" font-family="ui-monospace,monospace">Baseline</text>

  <!-- baseline file -->
  <rect x="304" y="112" width="172" height="110" rx="10" fill="#25392A" stroke="#84C48D" stroke-width="1.5"/>
  <text x="390" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#8ECB98">baseline.xml</text>
  <text x="390" y="162" text-anchor="middle" font-size="10.5" fill="#9DBDB6">a lista dos 247</text>
  <text x="390" y="180" text-anchor="middle" font-size="10.5" fill="#9DBDB6">“já conhecidos”</text>
  <text x="390" y="202" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8ECB98">→ silenciados</text>

  <!-- gate -->
  <text x="530" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#DFE1E5">A partir daí, cada build compara:</text>

  <!-- old issue path -->
  <rect x="500" y="120" width="248" height="60" rx="10" fill="#2E3350" stroke="#6366F1" stroke-width="1.3"/>
  <text x="516" y="144" font-size="11.5" fill="#AEB7F2" font-weight="700">aviso está no baseline?</text>
  <text x="516" y="164" font-size="10.5" fill="#AAB6C0">→ ignora. build <tspan font-weight="700" fill="#8ECB98">passa</tspan> ✓</text>
  <path d="M476 152 H 498" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- new issue path -->
  <rect x="500" y="196" width="248" height="70" rx="10" fill="#3C2428" stroke="#F0899A" stroke-width="1.5"/>
  <text x="516" y="220" font-size="11.5" fill="#F0899A" font-weight="700">aviso NOVO (fora do baseline)?</text>
  <text x="516" y="240" font-size="10.5" fill="#D79AA3">→ o PR introduziu.</text>
  <text x="516" y="256" font-size="10.5" fill="#D79AA3">build <tspan font-weight="700" fill="#F0899A">falha</tspan> ✗ — conserte antes de mesclar</text>

  <!-- new code source -->
  <rect x="30" y="288" width="220" height="72" rx="10" fill="#3C3F41" stroke="#DFE1E5" stroke-width="1.3"/>
  <text x="140" y="314" text-anchor="middle" font-size="12.5" font-weight="700" fill="#DFE1E5">seu PR de hoje</text>
  <text x="140" y="334" text-anchor="middle" font-size="10.5" fill="#AAB6C0">1 aviso novo: LongMethod</text>
  <text x="140" y="350" text-anchor="middle" font-size="10.5" fill="#AAB6C0">em Checkout.kt</text>
  <path d="M250 324 C 420 324, 470 250, 498 240" fill="none" stroke="#F0899A" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)"/>

  <rect x="304" y="300" width="444" height="60" rx="10" fill="#2B2D2F" stroke="#4E5254"/>
  <text x="320" y="322" font-size="11.5" font-weight="700" fill="#DFE1E5">A regra de ouro:</text>
  <text x="320" y="342" font-size="11" fill="#B7BFC7">o número de avisos <tspan font-weight="700">nunca sobe</tspan>. Consertou um legado? Regenere o baseline e ele cai.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <marker id="cf" markerWidth="12" markerHeight="12" refX="7" refY="3.4" orient="auto"><path d="M0 0 L8 3.4 L0 6.8 z" fill="#8ECB98"/></marker>
    <marker id="cfo" markerWidth="12" markerHeight="12" refX="7" refY="3.4" orient="auto"><path d="M0 0 L8 3.4 L0 6.8 z" fill="#E8A15C"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="330" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">As 3 fases de um frame no Compose</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#8A97A3">a UI declarativa vira pixels em tr&#234;s passos &#8212; e cada fase pode ser <tspan fill="#B7BFC7">pulada</tspan> se nada mudou nela</text>

  <!-- Composition -->
  <rect x="34" y="92" width="220" height="120" rx="12" fill="#2E3350" stroke="#6366F1" stroke-width="1.6"/>
  <text x="144" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#AEB7F2">1 · Composition</text>
  <text x="144" y="142" text-anchor="middle" font-size="10.5" fill="#AAB6C0">roda seus <tspan font-family="ui-monospace,monospace">@Composable</tspan></text>
  <text x="144" y="158" text-anchor="middle" font-size="10.5" fill="#AAB6C0">e monta a &#225;rvore de UI</text>
  <text x="144" y="180" text-anchor="middle" font-size="9.5" fill="#8A97A3">&#8220;O QUE mostrar&#8221;</text>
  <text x="144" y="197" text-anchor="middle" font-size="9.5" fill="#8ECB98">recompor = refazer s&#243; isto</text>

  <!-- Layout -->
  <rect x="290" y="92" width="220" height="120" rx="12" fill="#25392A" stroke="#84C48D" stroke-width="1.6"/>
  <text x="400" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#8ECB98">2 · Layout</text>
  <text x="400" y="142" text-anchor="middle" font-size="10.5" fill="#9DBDB6">mede e posiciona cada</text>
  <text x="400" y="158" text-anchor="middle" font-size="10.5" fill="#9DBDB6">n&#243; (uma passada s&#243;)</text>
  <text x="400" y="180" text-anchor="middle" font-size="9.5" fill="#8A97A3">&#8220;ONDE e que tamanho&#8221;</text>
  <text x="400" y="197" text-anchor="middle" font-size="9.5" fill="#9DBDB6">measure &#8594; place</text>

  <!-- Drawing -->
  <rect x="546" y="92" width="220" height="120" rx="12" fill="#2E2A22" stroke="#CC7832" stroke-width="1.6"/>
  <text x="656" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#E8A15C">3 · Drawing</text>
  <text x="656" y="142" text-anchor="middle" font-size="10.5" fill="#C9A97E">desenha na tela</text>
  <text x="656" y="158" text-anchor="middle" font-size="10.5" fill="#C9A97E">(pinta os pixels)</text>
  <text x="656" y="180" text-anchor="middle" font-size="9.5" fill="#8A97A3">&#8220;COMO aparece&#8221;</text>
  <text x="656" y="197" text-anchor="middle" font-size="9.5" fill="#C9A97E">Canvas / drawBehind</text>

  <path d="M254 152 L288 152" fill="none" stroke="#8ECB98" stroke-width="2.2" marker-end="url(#cf)"/>
  <path d="M510 152 L544 152" fill="none" stroke="#8ECB98" stroke-width="2.2" marker-end="url(#cf)"/>

  <!-- skip note -->
  <rect x="34" y="240" width="732" height="70" rx="10" fill="#2B2D2F" stroke="#4E5254"/>
  <text x="52" y="263" font-size="11.5" font-weight="700" fill="#DFE1E5">⚡ Por que isto importa para performance</text>
  <text x="52" y="284" font-size="10.5" fill="#AAB6C0">Mudou s&#243; a <tspan fill="#E8A15C">cor</tspan>? O Compose pula 1 e 2 e refaz s&#243; o <tspan fill="#E8A15C">Drawing</tspan>. Mudou s&#243; a <tspan fill="#8ECB98">posi&#231;&#227;o</tspan>? Pula a Composition.</text>
  <text x="52" y="301" font-size="10.5" fill="#AAB6C0">Ler estado na fase mais <tspan font-weight="700">tardia</tspan> poss&#237;vel (ex.: <tspan font-family="ui-monospace,monospace" fill="#B7BFC7">Modifier.offset{ }</tspan> lambda) evita recompor a &#225;rvore toda.</text>
</svg>

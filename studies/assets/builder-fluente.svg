<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <marker id="bf" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto"><path d="M0 0 L7.5 3.2 L0 6.4 z" fill="#E8A15C"/></marker>
    <marker id="bfg" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto"><path d="M0 0 L7.5 3.2 L0 6.4 z" fill="#8ECB98"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">Builder: montar passo a passo, s&#243; construir no fim</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#8A97A3">cada <tspan font-family="ui-monospace,monospace" fill="#B7BFC7">.set()</tspan> devolve <tspan font-family="ui-monospace,monospace" fill="#B7BFC7">this</tspan> &#8212; por isso encadeia; o objeto real nasce imut&#225;vel no <tspan font-family="ui-monospace,monospace" fill="#B7BFC7">.build()</tspan></text>

  <!-- fluent chain -->
  <rect x="40" y="92" width="150" height="52" rx="10" fill="#2E2A22" stroke="#CC7832" stroke-width="1.5"/>
  <text x="115" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#E8A15C">Builder()</text>
  <text x="115" y="131" text-anchor="middle" font-size="9.5" fill="#C9A97E">objeto mut&#225;vel vazio</text>

  <rect x="230" y="92" width="150" height="52" rx="10" fill="#2E2A22" stroke="#CC7832" stroke-width="1.5"/>
  <text x="305" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#E8A15C"><tspan font-family="ui-monospace,monospace">.setTitle(&#8230;)</tspan></text>
  <text x="305" y="131" text-anchor="middle" font-size="9.5" fill="#C9A97E">retorna <tspan font-family="ui-monospace,monospace">this</tspan></text>

  <rect x="420" y="92" width="150" height="52" rx="10" fill="#2E2A22" stroke="#CC7832" stroke-width="1.5"/>
  <text x="495" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#E8A15C"><tspan font-family="ui-monospace,monospace">.setIcon(&#8230;)</tspan></text>
  <text x="495" y="131" text-anchor="middle" font-size="9.5" fill="#C9A97E">retorna <tspan font-family="ui-monospace,monospace">this</tspan></text>

  <rect x="610" y="92" width="150" height="52" rx="10" fill="#25392A" stroke="#84C48D" stroke-width="1.6"/>
  <text x="685" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#8ECB98"><tspan font-family="ui-monospace,monospace">.build()</tspan></text>
  <text x="685" y="131" text-anchor="middle" font-size="9.5" fill="#9DBDB6">objeto imut&#225;vel pronto</text>

  <path d="M190 118 L228 118" fill="none" stroke="#E8A15C" stroke-width="2" marker-end="url(#bf)"/>
  <path d="M380 118 L418 118" fill="none" stroke="#E8A15C" stroke-width="2" marker-end="url(#bf)"/>
  <path d="M570 118 L608 118" fill="none" stroke="#8ECB98" stroke-width="2" marker-end="url(#bfg)"/>

  <!-- por que usar -->
  <rect x="40" y="176" width="350" height="168" rx="10" fill="#2B2D2F" stroke="#4E5254"/>
  <text x="60" y="200" font-size="12" font-weight="700" fill="#DFE1E5">Por que existe</text>
  <text x="60" y="222" font-size="10.5" fill="#AAB6C0">&#8226; evita o construtor telesc&#243;pico com 12</text>
  <text x="72" y="238" font-size="10.5" fill="#AAB6C0">par&#226;metros na ordem certa;</text>
  <text x="60" y="258" font-size="10.5" fill="#AAB6C0">&#8226; deixa campos opcionais legiveis (voc&#234; s&#243;</text>
  <text x="72" y="274" font-size="10.5" fill="#AAB6C0">chama o que precisa);</text>
  <text x="60" y="294" font-size="10.5" fill="#AAB6C0">&#8226; o produto final sai <tspan fill="#8ECB98">imut&#225;vel</tspan> e validado;</text>
  <text x="60" y="314" font-size="10.5" fill="#AAB6C0">&#8226; em Kotlin, <tspan fill="#B7BFC7">argumentos nomeados + default</tspan></text>
  <text x="72" y="330" font-size="10.5" fill="#AAB6C0">costumam substituir o Builder feito &#224; m&#227;o.</text>

  <!-- kotlin -->
  <rect x="410" y="176" width="350" height="168" rx="10" fill="#262626" stroke="#4E5254"/>
  <text x="428" y="200" font-family="ui-monospace,monospace" font-size="10.5" fill="#CC7832">val</text>
  <text x="462" y="200" font-family="ui-monospace,monospace" font-size="10.5" fill="#A9B7C6"> n = NotificationCompat.Builder(ctx, id)</text>
  <text x="428" y="220" font-family="ui-monospace,monospace" font-size="10.5" fill="#A9B7C6">   .setContentTitle(<tspan fill="#6A8759">&quot;Oi&quot;</tspan>)</text>
  <text x="428" y="240" font-family="ui-monospace,monospace" font-size="10.5" fill="#A9B7C6">   .setSmallIcon(R.drawable.ic)</text>
  <text x="428" y="260" font-family="ui-monospace,monospace" font-size="10.5" fill="#A9B7C6">   .setAutoCancel(<tspan fill="#CC7832">true</tspan>)</text>
  <text x="428" y="280" font-family="ui-monospace,monospace" font-size="10.5" fill="#A9B7C6">   .build()</text>
  <line x1="428" y1="296" x2="742" y2="296" stroke="#3A3D3F"/>
  <text x="428" y="316" font-family="ui-monospace,monospace" font-size="10.5" fill="#8A97A3"><tspan fill="#808080">// Kotlin idiom&#225;tico: sem Builder</tspan></text>
  <text x="428" y="334" font-family="ui-monospace,monospace" font-size="10.5" fill="#A9B7C6">Notif(title = <tspan fill="#6A8759">&quot;Oi&quot;</tspan>, autoCancel = <tspan fill="#CC7832">true</tspan>)</text>
</svg>

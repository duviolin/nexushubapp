<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <marker id="cc" markerWidth="12" markerHeight="12" refX="7" refY="3.4" orient="auto"><path d="M0 0 L8 3.4 L0 6.8 z" fill="#E0928A"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="500" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">Os c&#237;rculos da Clean Architecture (tio Bob) no Android</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#8A97A3">quanto mais para <tspan fill="#AEB7F2">dentro</tspan>, mais <tspan fill="#AEB7F2">est&#225;vel</tspan> e abstrato; toda seta de depend&#234;ncia aponta para o centro</text>

  <!-- concentric -->
  <circle cx="250" cy="270" r="200" fill="#2E2A22" stroke="#CC7832" stroke-width="1.6"/>
  <circle cx="250" cy="270" r="150" fill="#25392A" stroke="#84C48D" stroke-width="1.6"/>
  <circle cx="250" cy="270" r="100" fill="#2E3350" stroke="#6366F1" stroke-width="1.6"/>
  <circle cx="250" cy="270" r="52" fill="#22273F" stroke="#AEB7F2" stroke-width="1.8"/>

  <text x="250" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#E8A15C">Frameworks &amp; Drivers</text>
  <text x="250" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#8ECB98">Interface Adapters</text>
  <text x="250" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#AEB7F2">Use Cases</text>
  <text x="250" y="266" text-anchor="middle" font-size="11.5" font-weight="700" fill="#CDD3FF">Entities</text>
  <text x="250" y="282" text-anchor="middle" font-size="8.5" fill="#AAB6C0">(regras do</text>
  <text x="250" y="294" text-anchor="middle" font-size="8.5" fill="#AAB6C0">neg&#243;cio)</text>

  <!-- seta para dentro -->
  <path d="M250 480 L250 328" fill="none" stroke="#E0928A" stroke-width="2.4" marker-end="url(#cc)"/>
  <text x="270" y="440" font-size="10.5" font-weight="700" fill="#E0928A">depend&#234;ncia</text>
  <text x="270" y="455" font-size="10.5" font-weight="700" fill="#E0928A">aponta p/ dentro</text>

  <!-- legenda: mapeamento Android -->
  <text x="500" y="96" font-size="12" font-weight="700" fill="#DFE1E5">No Android, cada anel &#233;:</text>

  <rect x="500" y="112" width="272" height="66" rx="9" fill="#2E2A22" stroke="#CC7832"/>
  <text x="514" y="132" font-size="11" font-weight="700" fill="#E8A15C">Frameworks &amp; Drivers</text>
  <text x="514" y="150" font-size="9.5" fill="#C9A97E">Compose, Room, Retrofit, Android SDK,</text>
  <text x="514" y="165" font-size="9.5" fill="#C9A97E">o vol&#225;til &#8212; troc&#225;vel sem dor</text>

  <rect x="500" y="186" width="272" height="66" rx="9" fill="#25392A" stroke="#84C48D"/>
  <text x="514" y="206" font-size="11" font-weight="700" fill="#8ECB98">Interface Adapters</text>
  <text x="514" y="224" font-size="9.5" fill="#9DBDB6">ViewModel, Repository impl, Mappers &#8212;</text>
  <text x="514" y="239" font-size="9.5" fill="#9DBDB6">traduzem entre o de fora e o de dentro</text>

  <rect x="500" y="260" width="272" height="66" rx="9" fill="#2E3350" stroke="#6366F1"/>
  <text x="514" y="280" font-size="11" font-weight="700" fill="#AEB7F2">Use Cases</text>
  <text x="514" y="298" font-size="9.5" fill="#AAB6C0"><tspan font-family="ui-monospace,monospace">FazerLogin</tspan>, <tspan font-family="ui-monospace,monospace">AplicarCupom</tspan> &#8212; regras</text>
  <text x="514" y="313" font-size="9.5" fill="#AAB6C0">da aplica&#231;&#227;o (o que o app <em>faz</em>)</text>

  <rect x="500" y="334" width="272" height="66" rx="9" fill="#22273F" stroke="#AEB7F2"/>
  <text x="514" y="354" font-size="11" font-weight="700" fill="#CDD3FF">Entities</text>
  <text x="514" y="372" font-size="9.5" fill="#AAB6C0"><tspan font-family="ui-monospace,monospace">Usuario</tspan>, <tspan font-family="ui-monospace,monospace">Pedido</tspan> &#8212; regras do neg&#243;cio,</text>
  <text x="514" y="387" font-size="9.5" fill="#AAB6C0">verdadeiras mesmo sem app nenhum</text>

  <rect x="500" y="412" width="272" height="56" rx="9" fill="#2B2D2F" stroke="#4E5254"/>
  <text x="514" y="432" font-size="9.5" font-weight="700" fill="#DFE1E5">Cruzar a fronteira p/ fora?</text>
  <text x="514" y="449" font-size="9" fill="#AAB6C0">o de dentro define a <tspan fill="#B7BFC7">interface</tspan>; o de fora</text>
  <text x="514" y="462" font-size="9" fill="#AAB6C0">a implementa (inversão de depend&#234;ncia)</text>
</svg>

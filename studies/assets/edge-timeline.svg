<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <rect x="0" y="0" width="780" height="340" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">A linha do tempo dos mandatos</text>
  <text x="390" y="57" text-anchor="middle" font-size="13.5" fill="#8A97A3">Cada mudança de comportamento é atrelada ao <tspan font-weight="700" fill="#6366F1">targetSdk</tspan></text>

  <!-- axis -->
  <line x1="80" y1="104" x2="700" y2="104" stroke="#525659" stroke-width="2"/>
  <path d="M700 104 l-10 -5 v10 z" fill="#525659"/>
  <circle cx="170" cy="104" r="8" fill="#6366F1"/>
  <circle cx="390" cy="104" r="8" fill="#D97706"/>
  <circle cx="610" cy="104" r="8" fill="#F0899A"/>

  <!-- API 35 -->
  <text x="170" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#6366F1">2024</text>
  <line x1="170" y1="112" x2="170" y2="132" stroke="#525659" stroke-width="1.4"/>
  <rect x="70" y="134" width="200" height="176" rx="12" fill="#2E3350" stroke="#6366F1" stroke-width="1.4"/>
  <text x="170" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#AEB7F2">API 35 · Android 15</text>
  <line x1="88" y1="170" x2="252" y2="170" stroke="#4A5490"/>
  <text x="88" y="192" font-size="12" fill="#B7BFC7">• edge-to-edge vira o</text>
  <text x="98" y="208" font-size="12" fill="#B7BFC7">padrão (ao targetar 35)</text>
  <text x="88" y="234" font-size="12" fill="#B7BFC7">• APIs de cor de barra</text>
  <text x="98" y="250" font-size="12" fill="#B7BFC7">ficam DEPRECIADAS</text>

  <!-- API 36 -->
  <text x="390" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#D97706">2025</text>
  <line x1="390" y1="112" x2="390" y2="132" stroke="#525659" stroke-width="1.4"/>
  <rect x="290" y="134" width="200" height="176" rx="12" fill="#3C3420" stroke="#D97706" stroke-width="1.4"/>
  <text x="390" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E3AE72">API 36 · Android 16</text>
  <line x1="308" y1="170" x2="472" y2="170" stroke="#5A4A20"/>
  <text x="308" y="192" font-size="12" fill="#B7BFC7">• opt-out do edge-to-</text>
  <text x="318" y="208" font-size="12" fill="#B7BFC7">edge é DESLIGADO</text>
  <text x="308" y="234" font-size="12" fill="#B7BFC7">• orientação/resize</text>
  <text x="318" y="250" font-size="12" fill="#B7BFC7">ignorados em ≥ 600dp</text>
  <text x="318" y="266" font-size="11" fill="#E3AE72">(opt-out temporário)</text>

  <!-- API 37 -->
  <text x="610" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#F0899A">2026 ◄ seu emulador</text>
  <line x1="610" y1="112" x2="610" y2="132" stroke="#525659" stroke-width="1.4"/>
  <rect x="510" y="134" width="200" height="176" rx="12" fill="#3C2428" stroke="#F0899A" stroke-width="1.4"/>
  <text x="610" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#F0899A">API 37 · Android 17</text>
  <line x1="528" y1="170" x2="692" y2="170" stroke="#4A2C3A"/>
  <text x="528" y="192" font-size="12" fill="#B7BFC7">• opt-out de orientação</text>
  <text x="538" y="208" font-size="12" fill="#B7BFC7">REMOVIDO de vez</text>
  <text x="528" y="234" font-size="12" fill="#B7BFC7">• targetar 37 =</text>
  <text x="538" y="250" font-size="12" font-weight="700" fill="#F0899A">sem volta</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <rect x="0" y="0" width="800" height="430" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#DFE1E5">Anatomia da janela &#8212; e como navegar sem o mouse</text>

  <!-- janela mock -->
  <rect x="24" y="48" width="470" height="300" rx="8" fill="#2B2D2F" stroke="#4E5254"/>
  <!-- toolbar -->
  <rect x="24" y="48" width="470" height="30" rx="8" fill="#3C3F41"/>
  <rect x="24" y="66" width="470" height="12" fill="#3C3F41"/>
  <circle cx="300" cy="63" r="6" fill="#5A8A5A"/><path d="M297 60 l6 3 l-6 3 z" fill="#2B2D2F"/>
  <circle cx="322" cy="63" r="6" fill="#C0645A"/>
  <rect x="336" y="57" width="80" height="12" rx="3" fill="#2B2D2F"/><text x="376" y="66" text-anchor="middle" font-size="8" fill="#8A97A3">Pixel 8 · API 35</text>
  <text x="40" y="66" font-size="9" fill="#8A97A3">&#9654; Run   &#9679; Debug</text>

  <!-- left: project -->
  <rect x="28" y="82" width="120" height="240" rx="4" fill="#313335" stroke="#3A3D3F"/>
  <text x="88" y="98" text-anchor="middle" font-size="9" font-weight="700" fill="#AEB7F2">Project</text>
  <text x="36" y="116" font-size="8.5" font-family="ui-monospace,monospace" fill="#A9B7C6">&#9662; app</text>
  <text x="44" y="130" font-size="8.5" font-family="ui-monospace,monospace" fill="#A9B7C6">&#9662; kotlin</text>
  <text x="52" y="144" font-size="8.5" font-family="ui-monospace,monospace" fill="#8ECB98">ui/</text>
  <text x="52" y="158" font-size="8.5" font-family="ui-monospace,monospace" fill="#8ECB98">data/</text>
  <text x="44" y="172" font-size="8.5" font-family="ui-monospace,monospace" fill="#A9B7C6">&#9656; res</text>

  <!-- center: editor -->
  <rect x="152" y="82" width="338" height="200" rx="4" fill="#2B2D2F" stroke="#3A3D3F"/>
  <rect x="152" y="82" width="338" height="16" fill="#313335"/>
  <text x="164" y="94" font-size="8" fill="#DFE1E5">HomeScreen.kt</text>
  <rect x="156" y="102" width="14" height="176" fill="#313335"/>
  <circle cx="163" cy="140" r="4" fill="#E0928A"/>
  <text x="176" y="118" font-size="8.5" font-family="ui-monospace,monospace" fill="#CC7832">@Composable</text>
  <text x="176" y="132" font-size="8.5" font-family="ui-monospace,monospace" fill="#A9B7C6">fun Home() {</text>
  <text x="184" y="146" font-size="8.5" font-family="ui-monospace,monospace" fill="#A9B7C6">val s by vm.state</text>
  <text x="184" y="160" font-size="8.5" font-family="ui-monospace,monospace" fill="#A9B7C6">Column { ... }</text>
  <text x="176" y="174" font-size="8.5" font-family="ui-monospace,monospace" fill="#A9B7C6">}</text>
  <!-- minimap/scrollbar hint -->
  <rect x="480" y="102" width="6" height="176" fill="#313335"/>

  <!-- bottom tool bar -->
  <rect x="28" y="286" width="458" height="34" rx="4" fill="#313335" stroke="#3A3D3F"/>
  <text x="40" y="300" font-size="8" fill="#8A97A3">Logcat</text>
  <text x="82" y="300" font-size="8" fill="#8A97A3">Build</text>
  <text x="120" y="300" font-size="8" fill="#8A97A3">Terminal</text>
  <text x="176" y="300" font-size="8" fill="#8A97A3">Problems</text>
  <text x="234" y="300" font-size="8" fill="#8A97A3">Profiler</text>
  <text x="286" y="300" font-size="8" fill="#8A97A3">App Inspection</text>
  <text x="40" y="314" font-size="7.5" font-family="ui-monospace,monospace" fill="#6A8759">D/Nexus: login ok</text>

  <text x="40" y="340" font-size="9" fill="#8A97A3">esquerda: <tspan fill="#AEB7F2">Project</tspan> &#183; centro: <tspan fill="#DFE1E5">editor + sarjeta (gutter)</tspan> &#183; baixo: <tspan fill="#8ECB98">tool windows</tspan></text>

  <!-- painel navegação -->
  <rect x="510" y="48" width="266" height="300" rx="10" fill="#2E2A22" stroke="#CC7832"/>
  <text x="526" y="70" font-size="12" font-weight="700" fill="#E8A15C">Navegar sem o mouse (economiza horas)</text>
  <g font-size="10">
    <text x="526" y="94" fill="#E8A15C" font-weight="700">&#8679;&#8679;</text><text x="560" y="94" fill="#C9A97E">Search Everywhere &#8212; acha classe,</text>
    <text x="560" y="107" fill="#C9A97E">arquivo, a&#231;&#227;o, s&#237;mbolo, qualquer coisa</text>
    <text x="526" y="128" fill="#E8A15C" font-weight="700">&#8984;E</text><text x="560" y="128" fill="#C9A97E">arquivos recentes (o mais usado de todos)</text>
    <text x="526" y="149" fill="#E8A15C" font-weight="700">&#8984;B</text><text x="560" y="149" fill="#C9A97E">ir para a declara&#231;&#227;o</text>
    <text x="526" y="170" fill="#E8A15C" font-weight="700">&#8997;F7</text><text x="560" y="170" fill="#C9A97E">Find Usages &#8212; quem usa isto?</text>
    <text x="526" y="191" fill="#E8A15C" font-weight="700">&#8679;F6</text><text x="560" y="191" fill="#C9A97E">Rename seguro (em todo o projeto)</text>
    <text x="526" y="212" fill="#E8A15C" font-weight="700">&#8997;&#9166;</text><text x="560" y="212" fill="#C9A97E">Quick Fix / intention (a lampadinha)</text>
    <text x="526" y="233" fill="#E8A15C" font-weight="700">&#8984;F12</text><text x="560" y="233" fill="#C9A97E">estrutura do arquivo (pular por m&#233;todo)</text>
    <text x="526" y="254" fill="#E8A15C" font-weight="700">&#8984;&#8679;A</text><text x="560" y="254" fill="#C9A97E">&#8220;Find Action&#8221; &#8212; toda a&#231;&#227;o por nome</text>
  </g>
  <text x="526" y="284" font-size="9.5" fill="#8ECB98" font-weight="700">Local History (o salva-vidas esquecido)</text>
  <text x="526" y="300" font-size="9.5" fill="#C9A97E">bot&#227;o direito &#8594; Local History: a IDE guarda</text>
  <text x="526" y="314" font-size="9.5" fill="#C9A97E">cada altera&#231;&#227;o, mesmo sem commit &#8212; d&#225; p/</text>
  <text x="526" y="328" font-size="9.5" fill="#C9A97E">recuperar c&#243;digo que voc&#234; apagou &#8220;pra sempre&#8221;.</text>
  <text x="526" y="342" font-size="8.5" fill="#8A97A3">(atalhos = macOS; no Win/Linux troque &#8984;&#8594;Ctrl)</text>
</svg>

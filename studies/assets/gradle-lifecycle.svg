<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 452" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#94A3B8"/></marker></defs>
  <rect x="0" y="0" width="780" height="452" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">O ciclo de vida: as 3 fases, sempre nesta ordem</text>
  <text x="390" y="57" text-anchor="middle" font-size="13.5" fill="#8A97A3">Todo <tspan font-family="'SF Mono',ui-monospace,monospace" font-size="12">./gradlew &lt;tarefa&gt;</tspan> passa por elas — entender isso faz o resto clicar</text>


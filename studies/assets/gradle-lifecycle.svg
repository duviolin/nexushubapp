  <text x="390" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#B7BFC7" font-family="'SF Mono',ui-monospace,monospace">./gradlew assembleDebug</text>
  <line x1="390" y1="114" x2="390" y2="134" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="150" y="136" width="480" height="58" rx="12" fill="#2E3350" stroke="#6366F1" stroke-width="1.6"/>
  <text x="390" y="160" text-anchor="middle" font-size="14.5" font-weight="700" fill="#AEB7F2">1 · INITIALIZATION</text>
  <text x="390" y="180" text-anchor="middle" font-size="12" fill="#AAB6C0">lê settings.gradle.kts · descobre os módulos · resolve o wrapper — nada compilado ainda</text>
  <line x1="390" y1="194" x2="390" y2="214" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="150" y="216" width="480" height="58" rx="12" fill="#2E3350" stroke="#6366F1" stroke-width="1.6"/>
  <text x="390" y="240" text-anchor="middle" font-size="14.5" font-weight="700" fill="#AEB7F2">2 · CONFIGURATION</text>
  <text x="390" y="260" text-anchor="middle" font-size="12" fill="#AAB6C0">lê TODOS os build.gradle.kts · monta o DAG — ⚠️ lógica pesada aqui deixa TODO comando lento</text>
  <line x1="390" y1="274" x2="390" y2="294" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="150" y="296" width="480" height="58" rx="12" fill="#2E3350" stroke="#6366F1" stroke-width="1.6"/>
  <text x="390" y="320" text-anchor="middle" font-size="14.5" font-weight="700" fill="#AEB7F2">3 · EXECUTION</text>
  <text x="390" y="340" text-anchor="middle" font-size="12" fill="#AAB6C0">roda só as tarefas pedidas, na ordem do DAG · o que não mudou não recompila (incremental)</text>
  <line x1="390" y1="354" x2="390" y2="374" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>


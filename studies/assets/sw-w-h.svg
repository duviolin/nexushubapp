<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <rect x="0" y="0" width="780" height="390" rx="16" fill="#313335" stroke="#4E5254"/>
  <text x="390" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#DFE1E5">smallest width (sw) — a “carteira de identidade” do aparelho</text>
  <text x="390" y="59" text-anchor="middle" font-size="13.5" fill="#8A97A3">A largura disponível <tspan font-weight="700" fill="#EC8FBB">muda</tspan> ao girar; o <tspan font-weight="700" fill="#6366F1">sw</tspan> (a menor das duas) <tspan font-weight="700" fill="#6366F1">não</tspan></text>

  <!-- PORTRAIT -->
  <rect x="120" y="96" width="150" height="220" rx="14" fill="#3C3F41" stroke="#DFE1E5" stroke-width="2"/>
  <text x="195" y="212" text-anchor="middle" font-size="13" fill="#94A3B8">retrato</text>
  <!-- width dim (bottom) -->
  <g stroke="#EC8FBB" stroke-width="1.3"><line x1="120" y1="330" x2="270" y2="330"/><line x1="120" y1="324" x2="120" y2="336"/><line x1="270" y1="324" x2="270" y2="336"/></g>
  <text x="195" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#EC8FBB">largura (w) = 400dp</text>
  <!-- height dim (left) -->
  <g stroke="#8A97A3" stroke-width="1.2"><line x1="102" y1="96" x2="102" y2="316"/><line x1="96" y1="96" x2="108" y2="96"/><line x1="96" y1="316" x2="108" y2="316"/></g>
  <text x="90" y="206" text-anchor="middle" font-size="12" fill="#8A97A3" transform="rotate(-90 90 206)">altura (h) = 800dp</text>

  <!-- rotate arrow -->
  <text x="390" y="200" text-anchor="middle" font-size="15" fill="#6366F1" font-weight="700">girar 90°</text>
  <text x="390" y="230" text-anchor="middle" font-size="30" fill="#525659">⟳</text>

  <!-- LANDSCAPE -->
  <rect x="490" y="150" width="220" height="130" rx="14" fill="#3C3F41" stroke="#DFE1E5" stroke-width="2"/>
  <text x="600" y="220" text-anchor="middle" font-size="13" fill="#94A3B8">paisagem</text>
  <!-- width dim (bottom) -->
  <g stroke="#EC8FBB" stroke-width="1.3"><line x1="490" y1="296" x2="710" y2="296"/><line x1="490" y1="290" x2="490" y2="302"/><line x1="710" y1="290" x2="710" y2="302"/></g>
  <text x="600" y="318" text-anchor="middle" font-size="12.5" font-weight="700" fill="#EC8FBB">largura (w) = 800dp ← mudou</text>
  <!-- height dim (left) -->
  <g stroke="#8A97A3" stroke-width="1.2"><line x1="472" y1="150" x2="472" y2="280"/><line x1="466" y1="150" x2="478" y2="150"/><line x1="466" y1="280" x2="478" y2="280"/></g>
  <text x="460" y="215" text-anchor="middle" font-size="12" fill="#8A97A3" transform="rotate(-90 460 215)">altura = 400dp</text>

  <!-- sw badge spanning bottom -->
  <rect x="150" y="360" width="480" height="24" rx="12" fill="#2E3350" stroke="#6366F1" stroke-width="1"/>
  <text x="390" y="376" text-anchor="middle" font-size="12.5" fill="#AEB7F2"><tspan font-weight="700">sw = 400dp</tspan> nas duas orientações → é telefone (sw &lt; 600dp). Não muda ao girar.</text>
</svg>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --surface: #F4EFE5; --container: #FBF7EF; --ink: #241F18;
      --ink-2: rgba(31,27,21,0.55); --line: rgba(26,20,12,0.07);
      --accent: #E8B86D; --danger: #A6412A;
      --serif: "Newsreader", Georgia, serif; --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .mono { font-family: var(--mono); } .sans { font-family: var(--sans); } .serif { font-family: var(--serif); }
    .grp { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(31,27,21,0.4); padding: 0 20px 10px; }
    .row { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-top: 1px solid var(--line); }
    .rl { font-family: var(--sans); font-size: 15px; color: var(--ink); flex: 1; }
    .rv { font-family: var(--sans); font-size: 13px; color: var(--ink-2); }
    .ic { width: 20px; height: 20px; flex-shrink: 0; }
    .sw-on { width: 46px; height: 28px; border-radius: 999px; background: var(--accent); position: relative; flex-shrink: 0; }
    .sw-on span { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #1A140C; }
    .sw-off { width: 46px; height: 28px; border-radius: 999px; background: rgba(26,20,12,0.12); position: relative; flex-shrink: 0; }
    .sw-off span { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: rgba(31,27,21,0.8); }
  </style>
</helmet>

<div style="width: 390px; height: 940px; background: var(--surface); color: var(--ink); font-family: var(--sans); position: relative; overflow: hidden;">

  <div style="height: 44px;"></div>

  <!-- top bar -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 12px 20px;">
    <span class="serif" style="font-size: 24px; font-weight: 600;">Perfil</span>
    <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div>
  </div>

  <!-- user header -->
  <div style="display: flex; align-items: center; gap: 16px; padding: 4px 20px 20px;">
    <div style="width: 68px; height: 68px; border-radius: 50%; flex-shrink: 0; background: radial-gradient(120% 120% at 20% 10%, rgba(232,184,109,0.55), transparent 65%), #F1E6CF; border: 1px solid rgba(232,184,109,0.5); display: flex; align-items: center; justify-content: center;">
      <span class="serif" style="font-size: 26px; font-weight: 600; color: #8A5510;">EL</span>
    </div>
    <div style="flex: 1;">
      <div class="serif" style="font-size: 21px; font-weight: 600;">Eduardo Lima</div>
      <div class="mono" style="font-size: 12px; color: var(--ink-2); margin-top: 2px;">eduardo@nexus.dev</div>
      <div style="display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; padding: 3px 9px; border-radius: 999px; background: rgba(232,184,109,0.14); border: 1px solid rgba(232,184,109,0.3);"><span class="mono" style="font-size: 10px; letter-spacing: 0.08em; color: #8A5510;">NEXUS PRO</span></div>
    </div>
  </div>

  <!-- theme selector -->
  <div class="grp">Aparência</div>
  <div style="padding: 0 20px 20px;">
    <div style="display: flex; background: var(--container); border: 1px solid var(--line); border-radius: 12px; padding: 4px;">
      <div style="flex: 1; text-align: center; padding: 9px 0; border-radius: 9px; font-size: 13px; color: var(--ink-2);">Sistema</div>
      <div style="flex: 1; text-align: center; padding: 9px 0; border-radius: 9px; font-size: 13px; color: var(--ink-2);">Claro</div>
      <div style="flex: 1; text-align: center; padding: 9px 0; border-radius: 9px; font-size: 13px; font-weight: 600; background: rgba(232,184,109,0.18); color: #8A5510; border: 1px solid rgba(232,184,109,0.34);">Escuro</div>
    </div>
  </div>

  <!-- leitura -->
  <div class="grp">Leitura</div>
  <div class="row">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#8A5510" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
    <span class="rl">Fontes</span><span class="rv">HN · NewsAPI</span>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="rgba(31,27,21,0.4)" stroke-width="1.8" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
  </div>
  <div class="row">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#8A5510" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span class="rl">Marcar lido ao rolar</span><div class="sw-on"><span></span></div>
  </div>

  <!-- IA -->
  <div class="grp" style="margin-top: 20px;">Inteligência on-device</div>
  <div class="row">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#8A5510" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M5 12H2M22 12h-3M6 6l2 2M16 16l2 2"/></svg>
    <span class="rl">Resumo automático</span><div class="sw-on"><span></span></div>
  </div>
  <div class="row">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#8A5510" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5C6 5 18 5 22 8.5M5 12c4-3 10-3 14 0M8.5 15.5c2-1.4 5-1.4 7 0"/><circle cx="12" cy="19" r="0.6"/></svg>
    <span class="rl">Baixar modelo só no Wi-Fi</span><div class="sw-on"><span></span></div>
  </div>

  <!-- conta -->
  <div class="grp" style="margin-top: 20px;">Conta & privacidade</div>
  <div class="row">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#8A5510" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <span class="rl">Dados & LGPD</span>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="rgba(31,27,21,0.4)" stroke-width="1.8" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
  </div>
  <div class="row" style="border-bottom: 1px solid var(--line);">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>
    <span class="rl" style="color: var(--danger);">Sair</span>
  </div>

  <!-- fade + bottom nav -->
  <div style="position: absolute; left: 0; right: 0; bottom: 64px; height: 40px; background: linear-gradient(180deg, transparent, var(--surface));"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; padding: 0 44px; display: flex; align-items: center; justify-content: space-between; background: rgba(244,239,229,0.92); border-top: 1px solid var(--line);">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(31,27,21,0.5)" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/></svg><span style="font-size: 11px; color: rgba(31,27,21,0.5);">Feed</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(31,27,21,0.5)" stroke-width="1.8" stroke-linejoin="round"><path d="M6 4h12v16l-6-4-6 4z"/></svg><span style="font-size: 11px; color: rgba(31,27,21,0.5);">Ler depois</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="#8A5510" stroke="#8A5510" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span style="font-size: 11px; color: #8A5510; font-weight: 500;">Perfil</span></div>
  </div>

</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #E8B86D; } a:hover { color: #f0c98a; }
    .serif { font-family: "Newsreader", Georgia, serif; }
    .sans { font-family: "IBM Plex Sans", system-ui, sans-serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  </style>
</helmet>

<!-- exact Play Store canvas: 1024 x 500 -->
<div style="width:1024px; height:500px; background:#12110F; position:relative; overflow:hidden;" class="sans">

  <!-- ghosted hub motif on the right -->
  <svg width="620" height="620" viewBox="0 0 96 96" fill="none" style="position:absolute; right:-120px; top:50%; transform:translateY(-50%); opacity:0.14;">
    <line x1="48" y1="48" x2="24" y2="26" stroke="#E8B86D" stroke-width="1.4"/><line x1="48" y1="48" x2="72" y2="24" stroke="#E8B86D" stroke-width="1.4"/><line x1="48" y1="48" x2="24" y2="70" stroke="#E8B86D" stroke-width="1.4"/><line x1="48" y1="48" x2="72" y2="72" stroke="#E8B86D" stroke-width="1.4"/>
    <circle cx="24" cy="26" r="6.5" fill="none" stroke="#E8B86D" stroke-width="1.4"/><circle cx="72" cy="24" r="6.5" fill="none" stroke="#E8B86D" stroke-width="1.4"/><circle cx="24" cy="70" r="6.5" fill="none" stroke="#E8B86D" stroke-width="1.4"/><circle cx="72" cy="72" r="6.5" fill="none" stroke="#E8B86D" stroke-width="1.4"/><circle cx="48" cy="48" r="12" fill="none" stroke="#E8B86D" stroke-width="1.4"/>
  </svg>
  <!-- subtle amber lamp glow, top-left, solid radial (single hue, low intensity — reading-lamp, not mesh) -->
  <div style="position:absolute; left:60px; top:40px; width:420px; height:420px; background:radial-gradient(circle, rgba(232,184,109,0.10) 0%, transparent 62%); pointer-events:none;"></div>

  <!-- content -->
  <div style="position:absolute; left:72px; top:0; bottom:0; width:640px; display:flex; flex-direction:column; justify-content:center; gap:26px;">
    <!-- lockup -->
    <div style="display:flex; align-items:center; gap:20px;">
      <svg width="72" height="72" viewBox="0 0 96 96" fill="none"><line x1="48" y1="48" x2="24" y2="26" stroke="#E8B86D" stroke-width="3" stroke-opacity="0.5"/><line x1="48" y1="48" x2="72" y2="24" stroke="#E8B86D" stroke-width="3" stroke-opacity="0.5"/><line x1="48" y1="48" x2="24" y2="70" stroke="#E8B86D" stroke-width="3" stroke-opacity="0.5"/><line x1="48" y1="48" x2="72" y2="72" stroke="#E8B86D" stroke-width="3" stroke-opacity="0.5"/><circle cx="24" cy="26" r="6.5" fill="#12110F" stroke="#E8B86D" stroke-width="3"/><circle cx="72" cy="24" r="6.5" fill="#12110F" stroke="#E8B86D" stroke-width="3"/><circle cx="24" cy="70" r="6.5" fill="#12110F" stroke="#E8B86D" stroke-width="3"/><circle cx="72" cy="72" r="6.5" fill="#12110F" stroke="#E8B86D" stroke-width="3"/><circle cx="48" cy="48" r="12" fill="#E8B86D"/></svg>
      <div style="display:flex; align-items:baseline; gap:9px;">
        <span class="serif" style="font-size:52px; font-weight:600; color:#EDE6D9;">Nexus</span><span class="mono" style="font-size:33px; font-weight:500; color:#E8B86D;">Hub</span>
      </div>
    </div>
    <!-- headline -->
    <div class="serif" style="font-size:40px; line-height:1.18; font-weight:600; color:#EDE6D9; max-width:600px;">
      O terminal de leitura que<br>descansa a vista.
    </div>
    <!-- subcopy -->
    <div class="sans" style="font-size:19px; line-height:1.5; color:rgba(237,230,217,0.68); max-width:560px;">
      Hacker News, NewsAPI e RSS num só lugar. Resumos por IA, modo escuro editorial e leitura offline-first.
    </div>
    <!-- source chips -->
    <div style="display:flex; gap:10px; margin-top:4px;">
      <span class="mono" style="font-size:13px; color:rgba(237,230,217,0.72); background:rgba(232,184,109,0.10); border:1px solid rgba(232,184,109,0.28); border-radius:999px; padding:7px 14px;">Hacker News</span>
      <span class="mono" style="font-size:13px; color:rgba(237,230,217,0.72); background:rgba(232,184,109,0.10); border:1px solid rgba(232,184,109,0.28); border-radius:999px; padding:7px 14px;">NewsAPI</span>
      <span class="mono" style="font-size:13px; color:rgba(237,230,217,0.72); background:rgba(232,184,109,0.10); border:1px solid rgba(232,184,109,0.28); border-radius:999px; padding:7px 14px;">Resumo IA</span>
      <span class="mono" style="font-size:13px; color:rgba(237,230,217,0.72); background:rgba(232,184,109,0.10); border:1px solid rgba(232,184,109,0.28); border-radius:999px; padding:7px 14px;">Offline</span>
    </div>
  </div>

  <!-- solid amber node, focal, right-center -->
  <svg width="300" height="300" viewBox="0 0 96 96" fill="none" style="position:absolute; right:70px; top:50%; transform:translateY(-50%);">
    <line x1="48" y1="48" x2="24" y2="26" stroke="#E8B86D" stroke-width="2.4" stroke-opacity="0.6"/><line x1="48" y1="48" x2="72" y2="24" stroke="#E8B86D" stroke-width="2.4" stroke-opacity="0.6"/><line x1="48" y1="48" x2="24" y2="70" stroke="#E8B86D" stroke-width="2.4" stroke-opacity="0.6"/><line x1="48" y1="48" x2="72" y2="72" stroke="#E8B86D" stroke-width="2.4" stroke-opacity="0.6"/>
    <circle cx="24" cy="26" r="6.5" fill="#12110F" stroke="#E8B86D" stroke-width="3"/><circle cx="72" cy="24" r="6.5" fill="#12110F" stroke="#E8B86D" stroke-width="3"/><circle cx="24" cy="70" r="6.5" fill="#12110F" stroke="#E8B86D" stroke-width="3"/><circle cx="72" cy="72" r="6.5" fill="#12110F" stroke="#E8B86D" stroke-width="3"/>
    <circle cx="48" cy="48" r="12" fill="#E8B86D"/>
  </svg>

</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
